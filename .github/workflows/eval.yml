# Pons Family: on-demand behavioral eval for Jay against the live model API.
# Requires the JAY_API_KEY repository secret.
name: eval

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Only run cases whose id contains this text (blank = all)"
        required: false

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval -- ${{ inputs.filter }}
        env:
          JAY_API_KEY: ${{ secrets.JAY_API_KEY }}
